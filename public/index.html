<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>param8 Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
  <!-- <header>
    <h1>param8 Editor</h1>
  </header> -->

  <main>
    <!-- Controller Config Tab -->
    <section id="tab-controller" class="tab-content active">
      <div id="midi-status">
        <span id="midi-state">param8 not connected</span>
        <span id="fw-version" class="hidden"></span>
        <a id="changelog-toggle" href="#">Changelog</a>
        <button id="midi-connect">Connect param8</button>
        <button id="midi-disconnect" class="hidden danger">Disconnect</button>
        <div id="midi-connected-options" class="hidden">
          <span class="ctrl-ch-label">Layout</span>
          <div class="layout-tabs">
            <button class="layout-tab active" data-layout="0">Dynamic</button>
            <button class="layout-tab" data-layout="1">Compact</button>
            <button class="layout-tab hidden" data-layout="2">Stacked</button>
          </div>
          <span class="ctrl-ch-label">Brightness</span>
          <select id="brightness-select" class="ctrl-ch" style="width:64px">
            <option value="0">Low</option>
            <option value="1" selected>Mid</option>
            <option value="2">High</option>
          </select>
          <span class="ctrl-ch-label">Screensaver</span>
          <select id="screensaver-select" class="ctrl-ch">
            <option value="0">Off</option>
            <option value="60">1 min</option>
            <option value="120">2 min</option>
            <option value="300" selected>5 min</option>
            <option value="600">10 min</option>
            <option value="1800">30 min</option>
            <option value="3600">60 min</option>
            <option value="7200">120 min</option>
          </select>
        </div>
      </div>
      <div id="fw-update-banner" class="hidden">
        <span id="fw-update-text"></span>
        <a id="fw-update-download" href="#" download>Download update</a>
        <a id="fw-changelog-link" href="https://github.com/KBLiveSolutions/param8-firmware/releases" target="_blank" rel="noopener">What's new</a>
        <span id="fw-update-instructions">Hold Shift, plug in the USB cable, then drag and drop the .uf2 file onto the RPI-RP2 drive.</span>
      </div>
      <div id="controller-config">
        <div class="ctrl-layout">
          <div id="mode-user" class="mode-section">
            <div class="preset-toolbar">
              <span class="ctrl-ch-label">Preset</span>
              <select id="preset-select" class="ctrl-ch" style="width:110px"></select>
              <span class="ctrl-ch-label">Name</span>
              <input type="text" id="preset-name-input" maxlength="19" placeholder="Preset 1">
              <button id="ctrl-save">Save...</button>
              <button id="ctrl-load">Load...</button>
              <input type="file" id="ctrl-load-input" accept=".json" class="hidden">
            </div>
            <div id="controls-grid" class="controls-grid"></div>
          </div>

          <div id="mode-global" class="mode-section hidden"></div>
          <div id="mode-device" class="mode-section hidden"></div>
        </div>
      </div>
    </section>

  </main>

  <div id="changelog-panel" class="hidden">
    <div id="changelog-content">
      <div id="changelog-header">
        <h2>Firmware Changelog</h2>
        <button id="changelog-close">✕</button>
      </div>
      <pre id="changelog-text">Loading…</pre>
    </div>
  </div>

  <div id="modal-overlay" class="hidden">
    <div id="modal">
      <h3 id="modal-title"></h3>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button id="modal-cancel">Cancel</button>
        <button id="modal-ok" class="primary">OK</button>
      </div>
    </div>
  </div>

  <script src="controller.js"></script>
  <script src="app.js"></script>
</body>
</html>
