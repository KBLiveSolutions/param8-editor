<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>param8 Editor</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
  <header>
    <h1>param8 Editor</h1>
    <nav>
      <button class="tab active" data-tab="controller">Controller Config</button>
      <button class="tab" data-tab="mappings">Device Mappings</button>
    </nav>
  </header>

  <main>
    <!-- Controller Config Tab -->
    <section id="tab-controller" class="tab-content active">
      <div id="midi-status">
        <span id="midi-state">WebMIDI not connected</span>
        <button id="midi-connect">Connect param8</button>
        <div id="midi-connected-options" class="hidden">
          <span class="ctrl-ch-label">Layout</span>
          <div class="layout-tabs">
            <button class="layout-tab active" data-layout="0">Dynamic</button>
            <button class="layout-tab" data-layout="1">Compact</button>
            <button class="layout-tab" data-layout="2">Stacked</button>
          </div>
          <span class="ctrl-ch-label">Screensaver</span>
          <select id="screensaver-select" class="ctrl-ch">
            <option value="0">Off</option>
            <option value="60">1 min</option>
            <option value="120">2 min</option>
            <option value="300" selected>5 min</option>
            <option value="600">10 min</option>
            <option value="1800">30 min</option>
            <option value="3600">60 min</option>
            <option value="7200">120 min</option>
          </select>
        </div>
      </div>
      <div id="controller-config" class="hidden">
        <div class="ctrl-layout">
          <div class="ctrl-top-bar">
            <div class="preset-tabs">
              <button class="preset-tab active" data-preset="0">Preset 1</button>
              <button class="preset-tab" data-preset="1">Preset 2</button>
              <button class="preset-tab" data-preset="2">Preset 3</button>
              <button class="preset-tab" data-preset="3">Preset 4</button>
              <button class="preset-tab" data-preset="4">Preset 5</button>
              <button class="preset-tab" data-preset="5">Preset 6</button>
            </div>
            <div class="preset-name-wrap">
              <span class="ctrl-ch-label">Name</span>
              <input type="text" id="preset-name-input" maxlength="19" placeholder="Preset name">
            </div>
          </div>
          <div id="controls-grid" class="controls-grid"></div>

          <div class="ctrl-section-divider"></div>
          <div class="ctrl-top-bar">
            <div></div>
            <div class="ctrl-toolbar">
              <button id="ctrl-save">Save...</button>
              <button id="ctrl-load">Load...</button>
              <input type="file" id="ctrl-load-input" accept=".json" class="hidden">
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Device Mappings Tab -->
    <section id="tab-mappings" class="tab-content">
      <div class="mappings-layout">
        <aside class="device-sidebar">
          <div class="category-tabs">
            <button class="cat-tab active" data-category="audio_effects">Audio Effects</button>
            <button class="cat-tab" data-category="instruments">Instruments</button>
            <button class="cat-tab" data-category="midi_effects">MIDI Effects</button>
          </div>
          <div class="device-list-search">
            <input type="text" id="device-search" placeholder="Filter...">
          </div>
          <ul id="device-list"></ul>
        </aside>

        <div class="device-panel">
          <div id="device-editor" class="hidden">
            <div class="device-header">
              <h2 id="device-name"></h2>
              <button id="reset-device">Reset to Default</button>
              <button id="save-mappings" class="primary">Save</button>
              <span id="save-status"></span>
            </div>
            <div id="banks-container"></div>
          </div>
          <div id="no-device-selected" class="placeholder-msg">
            <p>Select a device from the list to edit its parameter banks.</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="modal-overlay" class="hidden">
    <div id="modal">
      <h3 id="modal-title"></h3>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button id="modal-cancel">Cancel</button>
        <button id="modal-ok" class="primary">OK</button>
      </div>
    </div>
  </div>

  <script src="devices.js"></script>
  <script src="mappings.js"></script>
  <script src="controller.js"></script>
  <script src="app.js"></script>
</body>
</html>
